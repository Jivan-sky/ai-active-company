<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark light">
<title>ANC 看板</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/app.css">
<script>
  // 主题在第一帧之前定下来：亮/暗都不闪一下白。
  // 手动选择优先；没选过默认浅色。localStorage 读不到（隐私模式）时也按浅色走。
  (function () {
    var t = "";
    try { t = localStorage.getItem("anc.theme") || ""; } catch (e) { t = ""; }
    if (t !== "light" && t !== "dark") t = "light";
    document.documentElement.dataset.theme = t;
  })();
</script>
<!--
  看板外壳。界面内容由 app.js（TS 构建产物）填。
  app.js 与 app.css 都是静态文件，随 anc 二进制一起嵌进去；运行时不需要 node。

  视觉语言：亮/暗双主题，同一套语义色；毛玻璃面板 + 香槟金/薄荷绿作为状态强调。
  参考过 neural-creator-dashboard 的设计判断（空间感、单点辉光、信息分层），
  但它的代码、CSS 与视频素材是 PolyForm-Noncommercial，不搬进商业交付物。
  本目录下的图形、动效与样式均为 ANC 独立实现。
-->
</head>
<body>
<main id="app"><div class="boot glass pad loading">正在读取真相源…</div></main>
<noscript><main><div class="glass" style="margin:24px;padding:20px 24px">看板需要 JavaScript 才能渲染。</div></main></noscript>
<script type="module" src="/app.js"></script>
</body>
</html>
