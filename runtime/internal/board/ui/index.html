<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<title>ANC 看板</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<!--
  这是看板的**外壳**：样式与骨架手写在这里，界面内容由 app.js（TS 构建产物）填。
  app.js 不是运行时依赖：它是构建期打出来的静态文件，随 anc 二进制一起嵌进去。

  版式：顶栏（品牌 + 状态 + 刷新）／左边一列导航（按「一个问题」分组）／右边当前页。
  导航用 <a href="#/id"> —— 浏览器原生 hash 路由，不写额外的路由器代码。

  视觉语言（2026-10-12 重做）：暖纸画布 + 冷白面 + 只有一个强调色 + 衬线大字。
    纸是**暖**的（#f7e7c4 → #fbeed6，对齐参考站 duet.so 量到的纸色），
    面是**冷白**的（#fcfcfd）—— 冷暖这一对撞，整页才立得住，阴影只是它的补刀。
    上一版把纸做成冷灰蓝（#f1f4f9），于是整页像后台系统，重做就是重做这一处。
    层次靠三样：冷白面浮在暖纸上、发丝线分格、大衬线标题。**不给什么都套卡片**。
    遮罩与描边取纸的暗部色（暖），冷黑硬影在这种底上一上去就掉档。
    强调色只有一个蓝（#2d74d2）；暖橙只做点缀。
    类名一个没改：`.glass` `.card` `.chip` `.dot` `.tab` … 都是 app.js 认的契约。

  动效预算（看板是天天看的工具，不是落地页，所以**分层**）：
    可动      —— 导航、空态、加载、状态灯的呼吸（只有「在动」的黄与「要人管」的红呼吸，绿和灰一律静）
    只进一次  —— 换页时每节内容的进场（blur-fade），不循环
    沉淀柱    —— 只有「沉淀」页那一处：料落下来、就地停住（它是口径图，不是统计）
    一律静    —— 表格、时间线、队列这些数据区
    硬约束：同视口同时循环的动效 ≤ 2 个；氛围件周期 ≥ 3.6s；不做快闪。
    系统开了「减少动态效果」时全部关掉（@media prefers-reduced-motion）。
-->
<style>
  :root {
    /* 纸：暖纸画布（量自参考站）。它跟「面」是**反色温**的一对 */
    --paper: #f7e7c4;
    --paper-2: #fbeed6;
    --paper-3: #f9e7c6;
    /* 面：冷白。这是整页「贵」的来源 —— 上一版错在把纸也做成了冷色 */
    --surface: #fcfcfd;
    --surface-2: #f3f5f9;

    /* 墨：偏蓝的深墨，不用纯黑（纯黑落在暖纸上会发闷） */
    --ink: #16223a;
    --ink-2: #3b4a63;
    --ink-3: #6d7a8f;

    /* 线：暖纸上用**暖**发丝线；冷线压在暖底上会显脏 */
    --line: rgba(122, 94, 44, 0.17);
    --line-2: rgba(122, 94, 44, 0.10);
    --line-cool: rgba(60, 80, 120, 0.13);

    /* 主色只有一个蓝；暖色只做点缀 */
    --accent: #2d74d2;
    --accent-2: #2266bf;
    --accent-3: #184eaa;
    --accent-soft: #e3edfb;
    --warm: #b96f1c;

    /* 语义色：形状 + 颜色一起变（色盲、灰度截图、小屏都分得开） */
    --green: #17924f;
    --amber: #d99a1a;
    --red: #cf3b30;
    /* 第五档（等一句话）用靛蓝：它跟那条蓝主色不是一个意思 ——
       主色是「可以点」，这一档是「有人在等你」，混了就把状态读成了链接 */
    --indigo: #4a45c4;

    --radius: 14px;
    --radius-lg: 20px;
    --pill: 999px;

    /* 影：暖底上的影要取纸的暗部色，冷黑硬影一上去就掉档 */
    --lift: 0 1px 0 #ffffff inset, 0 16px 34px -24px rgba(96, 72, 26, 0.55);
    --lift-2: 0 1px 0 #ffffff inset, 0 26px 54px -32px rgba(96, 72, 26, 0.6);

    --ui: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei",
          "Hiragino Sans GB", system-ui, sans-serif;
    /* 衬线：标题与数字用它。中文落到宋体族（思源宋体 / 宋体），西文落到 Georgia 族 */
    --serif: "Iowan Old Style", Georgia, "Times New Roman", "Source Han Serif SC",
             "Noto Serif CJK SC", "Songti SC", "SimSun", "宋体", serif;
    --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
  }
  * { box-sizing: border-box; }
  html, body { min-height: 100%; }
  body {
    margin: 0; color: var(--ink); font: 15px/1.66 var(--ui);
    -webkit-font-smoothing: antialiased;
    /* 纸不是一块死色：顶上亮一点（像光落在纸上），往下走一档。fixed 让长页不出现色带 */
    background:
      radial-gradient(120% 58% at 50% -14%, rgba(255, 255, 255, 0.62), rgba(255, 255, 255, 0) 62%),
      linear-gradient(180deg, var(--paper) 0%, var(--paper-2) 44%, var(--paper-3) 100%);
    background-attachment: fixed;
  }
  main { display: block; }
  .wrap { max-width: 1300px; margin: 0 auto; padding: 0 26px; }

  /* ---------- 顶栏：一条线，不套卡片 ---------- */
  .topline {
    display: flex; align-items: center; gap: 16px; flex-wrap: wrap;
    padding: 18px 0 15px; border-bottom: 1px solid var(--line);
  }
  .brandrow { display: flex; align-items: center; gap: 11px; min-width: 0; }
  .brandrow .glyph {
    width: 30px; height: 30px; border-radius: 9px; flex: none;
    background: linear-gradient(160deg, #5aa0ea, #2d74d2 62%, #184eaa);
    box-shadow: 0 9px 18px -9px rgba(34, 102, 191, 0.85), 0 1px 0 rgba(255, 255, 255, 0.55) inset;
  }
  .brandrow .nm { font-family: var(--serif); font-size: 19px; font-weight: 600; letter-spacing: -0.2px; }
  .brandrow .rule { width: 1px; height: 17px; background: var(--line); flex: none; }
  .brandrow .co {
    font-size: 13px; color: var(--ink-2); min-width: 0;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .brandrow .co .sub { color: var(--ink-3); font-size: 11.5px; margin-left: 7px; }
  .spacer { flex: 1 1 80px; }
  .meta { display: flex; gap: 9px; align-items: center; flex-wrap: wrap; justify-content: flex-end; }

  /* ---------- 壳 ---------- */
  .shell { display: grid; grid-template-columns: 238px minmax(0, 1fr); gap: 28px; align-items: start; padding: 26px 0 72px; }
  .col { min-width: 0; }

  /* ---------- 左导航：一摞白药丸（对齐参考站的导航语言） ---------- */
  .rail { position: sticky; top: 22px; }
  .brandbox { padding: 2px 4px 14px; border-bottom: 1px solid var(--line); margin-bottom: 4px; }
  .brandbox .mark { font-family: var(--mono); font-size: 10px; letter-spacing: 0.2em; text-transform: uppercase; color: var(--accent); }
  .brandbox .co { margin-top: 8px; font-family: var(--serif); font-size: 16.5px; font-weight: 600; line-height: 1.34; }
  .brandbox .sub { margin-top: 5px; font-size: 11.5px; color: var(--ink-3); line-height: 1.5; }
  .navgroup { margin-top: 20px; }
  .navgroup:first-child { margin-top: 14px; }
  .navgroup > .glabel {
    padding: 0 7px 9px; font-family: var(--mono); font-size: 10px; letter-spacing: 0.17em;
    text-transform: uppercase; color: var(--ink-3);
  }
  .navgroup > .gitems { display: flex; flex-direction: column; gap: 5px; }
  .tabs { display: flex; flex-direction: column; }
  .tab {
    display: flex; align-items: center; justify-content: space-between; gap: 9px;
    padding: 9px 15px; border-radius: var(--pill); text-decoration: none;
    color: var(--ink-2); font-size: 13.5px; background: var(--surface);
    box-shadow: var(--lift); transition: transform 0.18s ease, color 0.18s ease;
  }
  .tab:hover { color: var(--ink); transform: translateX(2px); text-decoration: none; }
  .tab.active {
    background: linear-gradient(180deg, #3d84e0, #2266bf); color: #fff; font-weight: 600;
    box-shadow: 0 12px 26px -14px rgba(34, 102, 191, 0.95), 0 1px 0 rgba(255, 255, 255, 0.4) inset;
  }
  .tab.active .res { background: rgba(255, 255, 255, 0.24); color: #fff; }
  .res { font-size: 10.5px; padding: 2px 8px; border-radius: var(--pill); white-space: nowrap; flex: none; }
  .res.on { color: #1d5ea8; background: var(--accent-soft); }
  .res.off { color: var(--ink-3); background: rgba(22, 34, 58, 0.06); }

  /* ---------- 页头：整页唯一的大字 ---------- */
  .hero { padding: 34px 2px 26px; }
  .hero h1 {
    margin: 0; font-family: var(--serif); font-size: clamp(27px, 3.1vw, 39px);
    font-weight: 600; line-height: 1.24; letter-spacing: -0.5px; color: var(--ink);
  }
  .hero .ask { margin: 12px 0 0; font-size: 14.5px; line-height: 1.7; color: var(--ink-2); max-width: 66ch; }
  /* 换页时页名揭示一次（遮罩从左往右拉出来 + 上移 9px）。刷新不算换页，所以刷新时不放。 */
  .hero h1.sweep { animation: mask-sweep 0.6s cubic-bezier(0.22, 1, 0.36, 1) both; }
  @keyframes mask-sweep {
    0%   { clip-path: inset(0 100% 0 0); transform: translateY(9px); }
    100% { clip-path: inset(0);          transform: translateY(0); }
  }

  /* ---------- 节：不套卡片，靠一条发丝线分格 ---------- */
  section.sec { margin-top: 30px; padding-top: 24px; border-top: 1px solid var(--line); }
  section.sec > h2 {
    margin: 0; font-size: 14.5px; font-weight: 650; letter-spacing: 0.2px;
    display: flex; align-items: baseline; gap: 11px; flex-wrap: wrap;
  }
  section.sec > h2 .hint { font-weight: 400; font-size: 12.5px; color: var(--ink-3); }
  /* 进场：换页时每节进一次（blur-fade），不循环。同视口并发的循环动效因此只有状态灯那两处。 */
  section.reveal { animation: rise 0.75s cubic-bezier(0.16, 1, 0.3, 1) both; }
  @keyframes rise {
    0%   { opacity: 0; transform: translateY(18px); filter: blur(6px); }
    100% { opacity: 1; transform: translateY(0);    filter: blur(0); }
  }

  /* ---------- 面：冷白。数据区上「一张纸」是层次，不是装饰 ---------- */
  .glass { background: var(--surface); border-radius: var(--radius-lg); box-shadow: var(--lift); }
  .pad { padding: 20px 24px; }
  .card { background: var(--surface); border-radius: var(--radius); padding: 16px 18px; box-shadow: var(--lift); }
  .card h3 { margin: 0 0 9px; font-size: 14.5px; font-weight: 620; display: flex; align-items: center; gap: 9px; flex-wrap: wrap; }
  .card dl { margin: 0; display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; font-size: 13px; }
  .card dt { color: var(--ink-3); white-space: nowrap; }
  .card dd { margin: 0; color: var(--ink-2); overflow-wrap: anywhere; }
  .grid { display: grid; gap: 14px; grid-template-columns: repeat(auto-fill, minmax(278px, 1fr)); margin-top: 18px; }
  .grid.stats { grid-template-columns: repeat(auto-fit, minmax(148px, 1fr)); }
  .cannot { color: var(--accent-3); }

  /* 数字带：直接落在暖纸上（发丝线分格），不上卡片 —— 卡片一多就又像后台了 */
  .figs {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
    margin-top: 20px; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line);
  }
  .fig { padding: 20px 20px 18px; border-left: 1px solid var(--line); }
  .fig:first-child { border-left: 0; padding-left: 2px; }
  .card.stat {
    background: transparent; border-left: 1px solid var(--line); border-radius: 0;
    box-shadow: none; padding: 20px 20px 18px;
  }
  .card.stat:first-child { border-left: 0; padding-left: 2px; }
  /* 数字用衬线体：等宽体读起来像后台日志，衬线体读起来像报告 */
  .card.stat .n, .fig .n {
    font-family: var(--serif); font-size: 42px; font-weight: 600; line-height: 1;
    letter-spacing: -1.2px; font-variant-numeric: lining-nums tabular-nums;
  }
  .card.stat .k, .fig .k { font-size: 13px; color: var(--ink-2); margin-top: 11px; }
  .card.stat .sub, .fig .sub { font-size: 11.5px; color: var(--ink-3); margin-top: 4px; }
  /* 状态点 + 文字：.dot 是固定宽高，得靠 inline-flex 才撑得开 */
  .st { display: inline-flex; align-items: center; gap: 8px; }

  /* 状态灯：**形状 + 颜色**一起变，不靠色深 —— 色盲、灰度截图、小屏都分得开。
     ok    = 实心圆         —— 好，已经过去了
     warn  = 带光环的圆     —— 运行中（那圈光晕在呼吸，就是「在动」）
     bad   = 菱形           —— 停 / 坏，形状和另外三个最不一样
     wait  = 靛蓝暂停形     —— **等人给一句话**（A2A 的 input-required）：
                              没坏，也不是系统自己在走，是缺一个决定或一次授权
     gray  = 空心虚线圈     —— 认不出的词，**没人判过**
     gray-solid = 灰实心    —— **本来就不该期待**（真相源声明「还没接凭据」）
     灰的两种**必须分开**：一个说「没人判过，去判」，一个说「本来就不该期待，别去催」——
     它们共用一个符号时，读的人分不清「没判过」和「没轮到你」，那正是 #59 要修的那件事。
     灰刻意不许像绿：一个是「过了」，一个是「没人判过」，混了就等于把没判过的当过了。
     只有 warn 与 bad 呼吸（4.4s，幅度压在 3px 以内）—— 会动的信息才需要动；
     其余一律静：它们没有「正在发生」的意思，动起来只会是噪音。
     **视觉重量按「要不要人动手」排**：红与靛蓝都是要人动手的，所以最大；
     灰是「没人判过」，得看得见 —— 看不清就会被读成「没问题」，那是最坏的一种误读。
     暖纸比冷底吃色，所以实心档都带一圈同色淡光环：小尺寸下也站得住。 */
  /* display: inline-block 不是装饰，是**这个点立不立得住**的前提：
     固定在宽高的 span 若还是 inline，宽高一律被忽略 —— 运行态那张表里用的是光杆 .dot
     （外面没有 .st 这个 inline-flex 撑着），它会塌成一根 4px 的细条，绿/黄/红三档更是一片空白。 */
  .dot { display: inline-block; width: 13px; height: 13px; flex: none; border-radius: 50%; background: transparent; border: 2px dashed var(--ink-3); }
  .dot.ok { background: var(--green); border: 0; box-shadow: 0 0 0 3.5px rgba(23, 146, 79, 0.17); }
  .dot.warn { background: var(--amber); border: 0; animation: breathe-warn 4.4s ease-in-out infinite; }
  .dot.bad {
    width: 16px; height: 16px;
    background: var(--red); border: 0; border-radius: 3.5px; transform: rotate(45deg);
    animation: breathe-bad 4.4s ease-in-out infinite;
  }
  .dot.gray { background: rgba(109, 122, 143, 0.08); border: 2px dashed var(--ink-3); box-shadow: none; animation: none; }
  /* 灰实心：**不该期待**（未接凭据）。与虚线圈的差别不只是「实/虚」——
     一个是「去判它」，一个是「别催它」，所以填充与描边一起变。 */
  .dot.gray-solid { background: var(--ink-3); border: 2px solid var(--ink-3); box-shadow: none; animation: none; }
  /* 等人给一句话：靛蓝 + 暂停形（两条竖杠）。形状只由 CSS 给，不加元素 ——
     「加一张表，别加一层 if」那条纪律同样管视觉：档与符号的对应全在这一段里。 */
  .dot.wait {
    width: 15px; height: 15px; border: 0; border-radius: 3px;
    background-color: transparent;
    background-image: linear-gradient(to right,
      var(--indigo) 0 33%, transparent 33% 66%, var(--indigo) 66% 100%);
    box-shadow: 0 0 0 3.5px rgba(74, 69, 196, 0.16);
  }
  /* 数字卡片上那些点再大一档：它们站在 42px 的大数字旁边，同一个尺寸会显得没重量。 */
  .card.stat .st .dot, .fig .st .dot { width: 17px; height: 17px; }
  .card.stat .st .dot.bad, .fig .st .dot.bad { width: 20px; height: 20px; }
  @keyframes breathe-warn {
    0%, 100% { box-shadow: 0 0 0 3.5px rgba(217, 154, 26, 0.16); }
    50%      { box-shadow: 0 0 0 6.5px rgba(217, 154, 26, 0.34); }
  }
  @keyframes breathe-bad {
    0%, 100% { box-shadow: 0 0 0 3.5px rgba(207, 59, 48, 0.16); }
    50%      { box-shadow: 0 0 0 6.5px rgba(207, 59, 48, 0.36); }
  }
  /* 图例：把「形状 → 含义」摆出来，省得靠颜色猜 */
  .legend { display: flex; flex-wrap: wrap; gap: 10px 22px; margin: 14px 0 0; font-size: 12.5px; color: var(--ink-2); }

  /* ---------- 表格：一张冷白的纸托着，行间只有发丝线 ---------- */
  .tw { margin-top: 18px; overflow-x: auto; background: var(--surface); border-radius: var(--radius-lg); box-shadow: var(--lift); padding: 6px 22px 10px; }
  .tw > table { margin-top: 0; }
  table { width: 100%; border-collapse: collapse; font-size: 13.5px; }
  th, td { text-align: left; padding: 11px 10px; border-bottom: 1px solid var(--line-cool); vertical-align: top; }
  td { overflow-wrap: anywhere; }
  th { color: var(--ink-3); font-weight: 560; font-size: 11.5px; white-space: nowrap; letter-spacing: 0.08em; }
  tbody tr:last-child td { border-bottom: none; }
  tbody tr:hover td { background: rgba(45, 116, 210, 0.035); }
  a { color: var(--accent-2); text-decoration: none; }
  a:hover { text-decoration: underline; }
  .chip {
    display: inline-flex; align-items: center; gap: 8px; padding: 5px 12px; border-radius: var(--pill);
    font-size: 12.5px; color: var(--ink-2); background: var(--surface); box-shadow: var(--lift); white-space: nowrap;
  }
  .chip.mono, .mono { font-family: var(--mono); font-size: 12px; }
  button.refresh {
    font: inherit; font-size: 13px; color: var(--ink); cursor: pointer; padding: 6px 16px;
    border-radius: var(--pill); border: 0; background: var(--surface); box-shadow: var(--lift);
  }
  button.refresh:hover { color: var(--accent-3); box-shadow: var(--lift-2); }
  button.refresh:disabled { opacity: 0.45; cursor: default; }

  /* ---------- 长列表翻页：页码进 hash（可分享、刷新还在这一页） ---------- */
  .pager { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-top: 16px; }
  a.pg {
    font: inherit; font-size: 13px; color: var(--ink); cursor: pointer; text-decoration: none;
    padding: 6px 15px; border-radius: var(--pill); background: var(--surface); box-shadow: var(--lift);
  }
  a.pg:hover { color: var(--accent-3); text-decoration: none; box-shadow: var(--lift-2); }
  a.pg[aria-disabled="true"] { opacity: 0.38; pointer-events: none; }
  .pgind { font-family: var(--mono); font-size: 12px; color: var(--ink-3); }

  /* ---------- 横幅：三档色的第四档也在（ok 是回执） ---------- */
  .banner { margin-top: 20px; padding: 15px 20px; border-radius: var(--radius); font-size: 13.5px; box-shadow: var(--lift); }
  .banner h3 { margin: 0 0 8px; font-size: 14px; font-weight: 620; }
  .banner ul { margin: 0; padding-left: 20px; }
  .banner li { margin: 3px 0; }
  .banner.bad { background: #fdf1ee; color: #8a3026; }
  .banner.warn { background: #fdf6e6; color: #6d4f10; }
  .banner.ok { background: #eef7f2; color: #1d6647; }

  /* ---------- 待批页：全站唯一能写的地方 ---------- */
  .field { margin-top: 12px; }
  input.by, input.why {
    font: inherit; font-size: 13.5px; color: var(--ink);
    padding: 8px 13px; border-radius: 11px; border: 1px solid var(--line);
    background: var(--surface);
  }
  input.by { width: 100%; max-width: 420px; }
  input.by:focus, input.why:focus { outline: 2px solid rgba(45, 116, 210, 0.3); outline-offset: 1px; border-color: var(--accent); }
  .grid.props { grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); }
  .card.prop .body {
    margin: 12px 0 0; font-size: 13px; line-height: 1.7; color: var(--ink-2);
    white-space: pre-wrap; overflow-wrap: anywhere; border-left: 2px solid var(--line); padding-left: 12px;
  }
  .card.prop input.why { width: 100%; margin-top: 12px; }
  .acts { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-top: 10px; }
  button.act {
    font: inherit; font-size: 13px; cursor: pointer; white-space: nowrap;
    padding: 7px 15px; border-radius: var(--pill); border: 0; background: var(--surface);
    color: var(--ink); box-shadow: var(--lift);
  }
  button.act:hover { box-shadow: var(--lift-2); }
  button.act:disabled { opacity: 0.45; cursor: default; }
  button.act.approve { color: #1d6647; background: #eef7f2; }
  button.act.reject { color: #8a3026; background: #fdf1ee; }
  button.act.hold { color: #6d4f10; background: #fdf6e6; }

  /* ---------- 上下文页：选人 / 选范围就是一行 chip（链接，不是按钮） ---------- */
  a.chip { color: var(--ink-2); }
  a.chip:hover { color: var(--accent-3); text-decoration: none; box-shadow: var(--lift-2); }
  a.chip[aria-current="true"] { color: var(--accent-3); font-weight: 560; box-shadow: var(--lift-2); }
  /* 标识符不该被列宽切成两半（slug / 证据指针）；.tw 本来就能横向滚，不会撑破整页 */
  .nw { white-space: nowrap; }
  /* 时间线页：一个 case 一个原生 <details> 折叠（不写 JS），summary 里点 + 字一行排 */
  details { margin-top: 12px; }
  details > summary { cursor: pointer; padding: 7px 2px; }
  details > summary .st { flex-wrap: wrap; }
  details > summary:hover { color: var(--accent-2); }

  .empty { color: var(--ink-3); font-size: 13px; margin: 14px 0 0; }
  footer { margin-top: 34px; padding-top: 20px; border-top: 1px solid var(--line); color: var(--ink-3); font-size: 12.5px; line-height: 1.95; }
  footer strong { color: var(--ink-2); font-weight: 560; }
  .loading { color: var(--ink-3); }

  /* ---------- 沉淀柱（口径图）：料从上面落下来，落到哪一层就停在哪一层 ---------- */
  .sedi { display: grid; grid-template-columns: minmax(0, 1fr) 318px; gap: 22px; margin-top: 20px; align-items: start; }
  .column { position: relative; display: flex; flex-direction: column; height: 490px; overflow: hidden;
            background: var(--surface); border-radius: var(--radius-lg); box-shadow: var(--lift-2); }
  .strata { position: relative; border-top: 1px solid var(--line-cool); }
  .strata:first-child { border-top: 0; }
  /* 一层的字在**左边一窄栏**，料在右边落 —— 两者不抢地方，层高也不用为了字加高 */
  .strata .lbl { position: absolute; left: 20px; top: 13px; font-size: 12.5px; font-weight: 620; color: var(--ink-2); z-index: 2; }
  .strata .cnt { position: absolute; right: 20px; top: 13px; font-family: var(--mono); font-size: 11px; color: var(--ink-3); z-index: 2; }
  .strata .note { position: absolute; left: 20px; top: 35px; width: 162px; font-size: 11.5px; line-height: 1.5; color: var(--ink-3); z-index: 2; }
  .s-open  { flex: 0 0 74px;  background: linear-gradient(180deg, rgba(247, 231, 196, 0.7), rgba(252, 252, 253, 0.35)); }
  .s-noise { flex: 0 0 76px;  background: repeating-linear-gradient(45deg, #f5f6f9 0 6px, #eceef4 6px 12px); }
  .s-hot   { flex: 0 0 106px; background: linear-gradient(180deg, #fdf3de, #f9e8c9); }
  .s-cold  { flex: 0 0 106px; background: linear-gradient(180deg, #e6eefb, #d5e3f8); }
  .s-mask  { flex: 1 1 auto;  background: repeating-linear-gradient(45deg, #eef1f6 0 6px, #e4e9f1 6px 12px); }
  .stream { position: absolute; inset: 0; pointer-events: none; z-index: 4; }
  /* 一颗料 = 一段料。落下去就地停住（forwards）—— 停住的那些就是「沉下来的」。 */
  .tk {
    position: absolute; top: 0; left: var(--x); height: 19px; padding: 0 8px; border-radius: 6px;
    display: flex; align-items: center; font-family: var(--mono); font-size: 9.5px; color: var(--ink-3);
    background: #fff; white-space: nowrap; opacity: 0;
    box-shadow: 0 5px 12px -7px rgba(60, 45, 15, 0.75), 0 0 0 1px var(--line-cool);
    animation: drop var(--dur) cubic-bezier(0.4, 0.03, 0.6, 0.97) var(--d) forwards;
  }
  @keyframes drop {
    0%   { opacity: 0; transform: translateY(-26px); }
    14%  { opacity: 1; }
    100% { opacity: 1; transform: translateY(var(--to)); }
  }
  /* 死掉的（重复 / 噪声）：掉到一半就散，那一层因此不增厚 */
  .tk.dead { animation-name: drop-dead; }
  @keyframes drop-dead {
    0%   { opacity: 0; transform: translateY(-26px); }
    14%  { opacity: 1; }
    58%  { opacity: 0.5; filter: blur(1px); }
    100% { opacity: 0; transform: translateY(var(--mid)) rotate(7deg); filter: blur(3px); }
  }
  /* 带明文的：落到一半，字被抹掉、换成一枚指针徽章（宽度跟着撑开） */
  .tk.masked { width: var(--w1);
               animation: drop var(--dur) cubic-bezier(0.4, 0.03, 0.6, 0.97) var(--d) forwards,
                          grow 0.34s cubic-bezier(0.16, 1, 0.3, 1) var(--g) forwards; }
  @keyframes grow { to { width: var(--w2); } }
  .tk .txt { display: inline-block; }
  .tk.masked .txt { animation: maskit var(--dur) steps(1, end) var(--d) forwards; }
  @keyframes maskit { 0%, 54% { opacity: 1; } 55%, 100% { opacity: 0; } }
  .tk .ptr { position: absolute; left: 8px; top: 0; height: 100%; display: flex; align-items: center;
             color: var(--accent-2); font-family: var(--ui); font-size: 10px; opacity: 0; }
  .tk.masked .ptr { animation: ptr-in 0.4s var(--g) forwards; }
  @keyframes ptr-in { to { opacity: 1; } }
  /* 减少动态效果：不落，直接摆到那一层上（信息一条不少） */
  .tk.still { animation: none; opacity: 1; transform: translateY(var(--to)); }
  .tk.still.dead { opacity: 0.28; transform: translateY(var(--mid)); }
  .tk.still.masked { width: var(--w2); }
  .tk.still.masked .txt { animation: none; opacity: 0; }
  .tk.still.masked .ptr { animation: none; opacity: 1; }

  .legendbox { display: flex; flex-direction: column; gap: 15px; }
  .li { display: grid; grid-template-columns: 16px minmax(0, 1fr) auto; gap: 12px; align-items: start; }
  .li .sw { width: 16px; height: 16px; border-radius: 5px; margin-top: 3px; box-shadow: 0 0 0 1px rgba(60, 45, 15, 0.09) inset; }
  .li b { font-weight: 620; font-size: 13.5px; }
  .li .n { font-family: var(--serif); font-size: 20px; font-weight: 600; line-height: 1.3; font-variant-numeric: tabular-nums; }
  .li p { margin: 4px 0 0; font-size: 12.5px; color: var(--ink-3); line-height: 1.62; }
  .li + .li { margin-top: 15px; }
  /* 图例色块：跟柱子上那几层同色，但形状是方胜（不是条），所以不复用 .s-* */
  .w-noise { background: repeating-linear-gradient(45deg, #f5f6f9 0 5px, #eceef4 5px 10px); }
  .w-hot   { background: linear-gradient(180deg, #fdf3de, #f9e8c9); }
  .w-cold  { background: linear-gradient(180deg, #e6eefb, #d5e3f8); }
  .w-mask  { background: repeating-linear-gradient(45deg, #eef1f6 0 5px, #e4e9f1 5px 10px); }
  .note { margin: 22px 2px 0; font-size: 12.5px; color: var(--ink-3); }
  .note b { color: var(--ink-2); }
  .tick { font-family: var(--mono); font-size: 10.5px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--ink-3); }

  /* ---------- 加载骨架：扫光一次 + 呼吸 ---------- */
  .sk { height: 13px; border-radius: 6px; background: var(--surface); position: relative; overflow: hidden;
        animation: sk-breath 3.6s ease-in-out infinite; }
  .sk + .sk { margin-top: 10px; }
  .sk::after {
    content: ""; position: absolute; inset: 0; transform: translateX(-100%);
    background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.85), transparent);
    animation: sk-sweep 1.4s cubic-bezier(0.16, 1, 0.3, 1) 50ms forwards;
  }
  @keyframes sk-breath { 0%, 100% { opacity: 1; } 50% { opacity: 0.58; } }
  @keyframes sk-sweep { 0% { transform: translateX(-100%); } 100% { transform: translateX(100%); } }

  @media (max-width: 1000px) {
    .sedi { grid-template-columns: minmax(0, 1fr); }
  }
  @media (max-width: 900px) {
    .shell { grid-template-columns: minmax(0, 1fr); }
    .rail { position: static; }
    .brandbox { border-bottom: none; padding-bottom: 0; }
    .tabs { flex-direction: row; overflow-x: auto; padding-bottom: 3px; gap: 10px; display: flex; }
    .navgroup { margin-top: 0; display: flex; align-items: center; gap: 6px; }
    .navgroup > .glabel { display: none; }
    .navgroup > .gitems { flex-direction: row; gap: 4px; }
    .tab { flex: none; gap: 6px; }
    .fig:first-child { padding-left: 20px; }
  }
  /* 系统开了「减少动态效果」：氛围件与进场全关。状态灯的形状与颜色不变，所以信息一条没丢。 */
  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; transition: none !important; }
  }
</style>
</head>
